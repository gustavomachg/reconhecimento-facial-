repos:
  - repo: local
    hooks:
      - id: check-private-files
        name: Bloqueia dados/modelos privados (LGPD)
        entry: python scripts/check_private_files.py
        language: system
        pass_filenames: true
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
