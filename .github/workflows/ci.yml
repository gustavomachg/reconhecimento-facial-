# Integração contínua: prova que o projeto instala e passa nos testes numa máquina limpa,
# em Linux e Windows, usando exatamente o requirements.txt. Não usa nenhum dado real.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar PyTorch (CPU) e dependências fixadas
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.2.2 torchvision==0.17.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Bloqueio de dados privados (LGPD)
        run: python scripts/check_private_files.py --all

      - name: Testes (somente dados sintéticos)
        run: pytest -v
