# E05 — facenet_full_finetune
experiment:
  id: E05
  name: facenet_full_finetune
  strategy: full
  hypothesis: >-
    Fine-tuning completo traz ganho pequeno ou overfitting em relação ao parcial, com custo de treino bem maior (custo x benefício).
seed: 42
device: auto

model:
  name: facenet
  pretrained: vggface2

data:
  dataset: CelebA (subconjunto, identidades com >= 15 imagens)
  aligned_root: data/public/aligned_facenet/celeba
  exclude_identities_file: data/public/celeba_exclude.txt   # gerado por check_identity_overlap.py
  exclude_files_list: data/public/duplicates_exclude.txt    # gerado por check_duplicates.py
  val_fraction: 0.15      # identidades DISJUNTAS do treino
  test_fraction: 0.15     # identidades reservadas (nunca usadas)
  image_size: 160
  val_pairs: 3000
  num_workers: 2
  augment:                # aplicado só no treino, depois do split
    enabled: true
    min_scale: 0.85
    rotation: 10
    color_p: 0.8
    gray_p: 0.1

training:
  strategy: full
  trainable_blocks: []
  epochs: 15
  optimizer: adam
  lr: 1.0e-5
  weight_decay: 0.0005
  scheduler: cosine
  early_stopping_patience: 4
  batch_size: 64
loss:
  name: arcface     # mesma loss do E04 para isolar o efeito parcial x completo
  s: 30.0
  m: 0.5
evaluation:
  lfw:
    root: data/public/aligned_facenet/lfw
    pairs: data/public/aligned_facenet/lfw/pairs.txt
  lfw_strategy: max_accuracy   # threshold de cada fold escolhido nos outros 9 folds
  private:
    enabled: true
    aligned_root: data/private/aligned_facenet
    gallery_sessions: [s1]
    val_sessions: [s2]
    test_sessions: [s3]
    n_unknown_val: 1
    n_unknown_test: 1
    n_pairs: 2000


output:
  checkpoint: checkpoints/finetuned/E05.pt   # ignorado pelo git
  results_dir: experiments/results/E05
